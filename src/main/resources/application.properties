spring.application.name=Backend_SmartDrop

# Active Profile: Defaults to 'dev' (H2 in-memory), configurable via env var
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Server Port: Dynamic for Render cloud (${PORT}) and local default (8080)
server.port=${PORT:8080}

# Application Information for OpenAPI / Swagger Documentation
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

documentation.application.title=SmartDrop API
documentation.application.description=IoT Liquid Monitoring & Quality Management Platform API
documentation.application.version=1.0.0

# JWT Configuration Properties
authorization.jwt.secret=${SMARTDROP_JWT_SECRET}
authorization.jwt.expiration.days=7